# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # Use a specific, stable revision
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0 # Use a specific, stable revision
    hooks:
      - id: isort
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args: [--remove-all-unused-imports, --in-place]
  - repo: https://github.com/psf/black
    rev: 25.11.0 # Use the latest stable version of Black
    hooks:
      - id: black
        language_version: python3.13 # Specify your Python version
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0 # Use the latest stable version of Flake8
    hooks:
      - id: flake8
        args: [--max-line-length=95]
