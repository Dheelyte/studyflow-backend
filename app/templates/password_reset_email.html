<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your Primerly password</title>
    <style>
        /* Modern Reset */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f7f9;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table {
            border-spacing: 0;
        }

        img {
            border: 0;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        /* Layout */
        .email-wrapper {
            width: 100%;
            background-color: #f4f7f9;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .email-content {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .code-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #1a1a1a;
        }

        @media screen and (max-width: 600px) {
            .content-padding {
                padding: 20px !important;
            }

            .email-content {
                margin-top: 0;
                margin-bottom: 0;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>
    <div class="email-wrapper">
        <div class="email-content">

            <div style="padding: 30px 20px; text-align: center; background-color: #1a1a1a;">
                <h1 style="color: #ffffff; margin: 0; font-size: 28px; letter-spacing: -0.5px;">Primerly</h1>
            </div>

            <div class="content-padding" style="padding: 40px;">

                <p style="font-size: 16px; line-height: 1.6; color: #4b5563;">
                    <strong>Hi {{name}},</strong><br><br>
                    We received a request to reset your Primerly password. Use the code below to continue:
                </p>

                <div class="code-box" style="margin: 32px 0;">{{code}}</div>

                <p style="font-size: 15px; line-height: 1.6; color: #4b5563;">
                    This code expires in <strong>{{expires_minutes}} minutes</strong>.
                </p>

                <p style="font-size: 14px; line-height: 1.6; color: #9ca3af;">
                    If you didn't request a password reset, you can safely ignore this email — your password will stay
                    unchanged.
                </p>
            </div>

            <div
                style="padding: 32px 20px; text-align: center; background-color: #f9fafb; font-size: 12px; color: #9ca3af;">
                <p style="margin: 0 0 8px 0;">© 2026 Primerly</p>
            </div>
        </div>
    </div>
</body>

</html>
